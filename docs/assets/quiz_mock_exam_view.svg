<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <!-- Pure Black Background -->
  <rect width="1200" height="760" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="760" fill="none" stroke="#1c1c24" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">CALYPSO<tspan fill="#3d5afe">-RAG</tspan></text>
    <rect x="160" y="-15" width="165" height="24" rx="6" fill="#181828" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
    <text x="242" y="1" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">GATE CS Practice Exam</text>

    <!-- Timer -->
    <rect x="830" y="-16" width="140" height="28" rx="8" fill="#201414" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="848" cy="-2" r="3" fill="#ef4444"/>
    <text x="895" y="2" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">⏱️ 09:42</text>

    <!-- Submit Exam -->
    <rect x="980" y="-16" width="140" height="28" rx="6" fill="#3d5afe"/>
    <text x="1050" y="2" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Submit Exam →</text>
  </g>

  <!-- Exam Workspace Container -->
  <g transform="translate(60, 100)">
    <!-- Left Column: Question Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="760" height="580" rx="14" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      
      <!-- Question Header -->
      <g transform="translate(25, 25)">
        <text x="0" y="18" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Question 1 of 9</text>
        <rect x="125" y="3" width="130" height="20" rx="4" fill="#181828" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
        <text x="190" y="17" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">OPERATING SYSTEMS</text>

        <!-- Marks Scheme -->
        <text x="540" y="18" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">+2.0 Marks</text>
        <text x="630" y="18" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">-0.66 Neg</text>
      </g>

      <line x1="25" y1="60" x2="735" y2="60" stroke="#1c1c28" stroke-width="1"/>

      <!-- Question Text -->
      <g transform="translate(25, 85)">
        <text x="0" y="20" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="16" font-weight="400">
          An OS uses a 2-level page table where TLB access time is 20 ns and main memory
        </text>
        <text x="0" y="45" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="16" font-weight="400">
          access time is 100 ns. If the TLB hit ratio is 90%, what is the Effective Memory
        </text>
        <text x="0" y="70" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="16" font-weight="400">
          Access Time (EMAT)?
        </text>
      </g>

      <!-- Options -->
      <g transform="translate(25, 185)">
        <!-- Option A -->
        <rect x="0" y="0" width="710" height="44" rx="8" fill="#14141e" stroke="#252535" stroke-width="1"/>
        <circle cx="25" cy="22" r="8" fill="none" stroke="#444" stroke-width="1.5"/>
        <text x="45" y="27" fill="#ccc" font-family="-apple-system, sans-serif" font-size="14">A) 122 ns</text>

        <!-- Option B -->
        <rect x="0" y="54" width="710" height="44" rx="8" fill="#14141e" stroke="#252535" stroke-width="1"/>
        <circle cx="25" cy="76" r="8" fill="none" stroke="#444" stroke-width="1.5"/>
        <text x="45" y="81" fill="#ccc" font-family="-apple-system, sans-serif" font-size="14">B) 140 ns</text>

        <!-- Option C (Selected) -->
        <rect x="0" y="108" width="710" height="44" rx="8" fill="#18182c" stroke="#3d5afe" stroke-width="1.5"/>
        <circle cx="25" cy="130" r="8" fill="#3d5afe"/>
        <circle cx="25" cy="130" r="3" fill="#ffffff"/>
        <text x="45" y="135" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">C) 142 ns (considering TLB miss parallel memory overlap)</text>

        <!-- Option D -->
        <rect x="0" y="162" width="710" height="44" rx="8" fill="#14141e" stroke="#252535" stroke-width="1"/>
        <circle cx="25" cy="184" r="8" fill="none" stroke="#444" stroke-width="1.5"/>
        <text x="45" y="189" fill="#ccc" font-family="-apple-system, sans-serif" font-size="14">D) 220 ns</text>
      </g>

      <!-- Bottom Action Buttons -->
      <g transform="translate(25, 490)">
        <line x1="0" y1="0" x2="710" y2="0" stroke="#1c1c28" stroke-width="1"/>

        <rect x="0" y="20" width="160" height="36" rx="6" fill="#181824" stroke="#333" stroke-width="1"/>
        <text x="80" y="42" fill="#ccc" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Mark for Review</text>

        <rect x="175" y="20" width="120" height="36" rx="6" fill="#181824" stroke="#333" stroke-width="1"/>
        <text x="235" y="42" fill="#888" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Clear Choice</text>

        <rect x="560" y="20" width="150" height="36" rx="6" fill="#3d5afe"/>
        <text x="635" y="42" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Save &amp; Next →</text>
      </g>
    </g>

    <!-- Right Column: Question Status Palette -->
    <g transform="translate(790, 0)">
      <rect x="0" y="0" width="290" height="580" rx="14" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      
      <text x="25" y="38" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Question Palette</text>

      <!-- Legend -->
      <g transform="translate(25, 60)">
        <circle cx="6" cy="6" r="5" fill="#10b981"/>
        <text x="18" y="10" fill="#aaa" font-family="monospace" font-size="9">Answered (1)</text>

        <circle cx="105" cy="6" r="5" fill="#8b5cf6"/>
        <text x="117" y="10" fill="#aaa" font-family="monospace" font-size="9">Review (1)</text>

        <circle cx="185" cy="6" r="5" fill="#333"/>
        <text x="197" y="10" fill="#aaa" font-family="monospace" font-size="9">Unattempted (7)</text>
      </g>

      <!-- Grid Buttons -->
      <g transform="translate(25, 95)">
        <!-- Q1 (Active / Answered) -->
        <rect x="0" y="0" width="65" height="50" rx="6" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
        <text x="32" y="30" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q1</text>

        <!-- Q2 (Review) -->
        <rect x="85" y="0" width="65" height="50" rx="6" fill="#8b5cf6"/>
        <text x="117" y="30" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q2</text>

        <!-- Q3 -->
        <rect x="170" y="0" width="65" height="50" rx="6" fill="#1c1c28" stroke="#333" stroke-width="1"/>
        <text x="202" y="30" fill="#888" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q3</text>

        <!-- Row 2 -->
        <rect x="0" y="65" width="65" height="50" rx="6" fill="#1c1c28" stroke="#333" stroke-width="1"/>
        <text x="32" y="95" fill="#888" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q4</text>

        <rect x="85" y="65" width="65" height="50" rx="6" fill="#1c1c28" stroke="#333" stroke-width="1"/>
        <text x="117" y="95" fill="#888" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q5</text>

        <rect x="170" y="65" width="65" height="50" rx="6" fill="#1c1c28" stroke="#333" stroke-width="1"/>
        <text x="202" y="95" fill="#888" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q6</text>

        <!-- Row 3 -->
        <rect x="0" y="130" width="65" height="50" rx="6" fill="#1c1c28" stroke="#333" stroke-width="1"/>
        <text x="32" y="160" fill="#888" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q7</text>

        <rect x="85" y="130" width="65" height="50" rx="6" fill="#1c1c28" stroke="#333" stroke-width="1"/>
        <text x="117" y="160" fill="#888" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q8</text>

        <rect x="170" y="130" width="65" height="50" rx="6" fill="#1c1c28" stroke="#333" stroke-width="1"/>
        <text x="202" y="160" fill="#888" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Q9</text>
      </g>

      <!-- Instant Review Feature Callout -->
      <g transform="translate(25, 330)">
        <rect x="0" y="0" width="240" height="210" rx="8" fill="#141422" stroke="#3d5afe" stroke-opacity="0.3" stroke-width="1"/>
        <text x="15" y="25" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="bold">⚡ CALYPSO EXAM REVIEW</text>
        <text x="15" y="50" fill="#ccc" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">Upon exam submission:</text>
        <text x="15" y="75" fill="#888" font-family="-apple-system, sans-serif" font-size="10">• Real GATE CS percentile score</text>
        <text x="15" y="95" fill="#888" font-family="-apple-system, sans-serif" font-size="10">• Negative marking audit report</text>
        <text x="15" y="115" fill="#888" font-family="-apple-system, sans-serif" font-size="10">• Step-by-step KaTeX proofs</text>
        <text x="15" y="135" fill="#888" font-family="-apple-system, sans-serif" font-size="10">• Targeted Simulation Sliders</text>
        <text x="15" y="155" fill="#888" font-family="-apple-system, sans-serif" font-size="10">• IIT Professor Audio Voice</text>
      </g>
    </g>
  </g>
</svg>
