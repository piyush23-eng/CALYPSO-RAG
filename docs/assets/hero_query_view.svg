<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d5afe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3d5afe" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Top Navigation -->
  <text x="60" y="55" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="0.1em">CALYPSO-RAG</text>
  <rect x="210" y="40" width="75" height="22" rx="11" fill="#1e1e24"/>
  <text x="247" y="55" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">v2.0 QLoRA</text>

  <text x="1000" y="55" fill="#888" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">/evaluation</text>
  <text x="1110" y="55" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">GitHub ↗</text>

  <!-- Hero Header -->
  <text x="60" y="150" fill="#888" font-family="monospace" font-size="13" font-weight="600" letter-spacing="0.15em">AGENTIC RETRIEVAL-AUGMENTED GENERATION · GATE CS/IT</text>
  
  <text x="60" y="220" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.03em">Ask GATE CS.</text>
  <text x="60" y="280" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.03em">Get answers with <tspan fill="#3d5afe">receipts.</tspan></text>

  <!-- Input Field Box -->
  <g transform="translate(60, 330)">
    <line x1="0" y1="50" x2="1080" y2="50" stroke="#333333" stroke-width="2"/>
    <text x="10" y="32" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="20" font-weight="400">Consider a hard disk with a rotational speed of 15000 rpm... transfer 10 sectors in tracks 5, 12, 7</text>
    <line x1="1025" y1="12" x2="1025" y2="38" stroke="#3d5afe" stroke-width="3"/>
    <circle cx="1060" cy="25" r="20" fill="#3d5afe"/>
    <text x="1060" y="31" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">→</text>
  </g>

  <!-- Marquee Ticker Strip -->
  <g transform="translate(60, 430)">
    <rect x="0" y="0" width="1080" height="42" rx="6" fill="#141416" stroke="#26262a" stroke-width="1"/>
    
    <!-- Topic Badges -->
    <rect x="15" y="8" width="140" height="26" rx="4" fill="#1f1f24"/>
    <text x="85" y="25" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">Hard Disk Access</text>

    <rect x="170" y="8" width="150" height="26" rx="4" fill="#1f1f24"/>
    <text x="245" y="25" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">TLB Multi-Level EMAT</text>

    <rect x="335" y="8" width="140" height="26" rx="4" fill="#1f1f24"/>
    <text x="405" y="25" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">Strict 2PL Concurrency</text>

    <rect x="490" y="8" width="140" height="26" rx="4" fill="#1f1f24"/>
    <text x="560" y="25" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">Floyd's Heap Build O(n)</text>

    <rect x="645" y="8" width="160" height="26" rx="4" fill="#1f1f24"/>
    <text x="725" y="25" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">TCP Congestion Control</text>

    <rect x="820" y="8" width="130" height="26" rx="4" fill="#1f1f24"/>
    <text x="885" y="25" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">LALR(1) Parsing</text>

    <rect x="965" y="8" width="105" height="26" rx="4" fill="#1f1f24"/>
    <text x="1017" y="25" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">Bayes' Theorem</text>
  </g>

  <!-- Preset Benchmark Chips -->
  <text x="60" y="520" fill="#666" font-family="monospace" font-size="12" font-weight="600">OR TEST A GOLD-STANDARD BENCHMARK:</text>
  
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="340" height="70" rx="8" fill="#111113" stroke="#222" stroke-width="1"/>
    <text x="16" y="26" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="bold">COA · DISK GEOMETRY</text>
    <text x="16" y="48" fill="#eee" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">15000 RPM disk seek &amp; sector transfer time</text>

    <rect x="360" y="0" width="340" height="70" rx="8" fill="#111113" stroke="#222" stroke-width="1"/>
    <text x="376" y="26" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="bold">OS · VIRTUAL MEMORY</text>
    <text x="376" y="48" fill="#eee" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">2-level paging EMAT with 0.95 TLB hit ratio</text>

    <rect x="720" y="0" width="360" height="70" rx="8" fill="#111113" stroke="#222" stroke-width="1"/>
    <text x="736" y="26" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="bold">DBMS · CONCURRENCY</text>
    <text x="736" y="48" fill="#eee" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Strict 2PL cascadeless schedule proof</text>
  </g>
</svg>
