<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5afe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3d5afe" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#0e0e16"/>
    </linearGradient>
  </defs>

  <!-- Pure Black Background -->
  <rect width="1200" height="760" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="760" fill="none" stroke="#1c1c24" stroke-width="1"/>

  <!-- Top Studio Navigation -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="0.1em">CALYPSO<tspan fill="#3d5afe">-RAG</tspan></text>
    <rect x="160" y="-15" width="85" height="22" rx="11" fill="#181826" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
    <text x="202" y="0" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">v2.0 QLoRA</text>

    <!-- Nav Links -->
    <rect x="730" y="-14" width="80" height="26" rx="6" fill="#181826" stroke="#3d5afe" stroke-width="1"/>
    <text x="770" y="3" fill="#ffffff" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">/solver</text>
    
    <text x="850" y="3" fill="#888899" font-family="monospace" font-size="11" font-weight="500">/quiz</text>
    <text x="920" y="3" fill="#888899" font-family="monospace" font-size="11" font-weight="500">/evaluation</text>
    <text x="1030" y="3" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">GitHub ↗</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(60, 130)">
    <circle cx="5" cy="5" r="4" fill="#3d5afe"/>
    <text x="18" y="9" fill="#8888a0" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.16em">AGENTIC RAG ENGINE • 10 GATE CS SUBJECTS • VISION &amp; VOICE TUTOR</text>
  </g>

  <!-- Massive Headline -->
  <g transform="translate(60, 195)">
    <text x="0" y="0" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.04em">Ask GATE CS.</text>
    <text x="0" y="60" fill="#75758a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.04em">Get answers with <tspan fill="#f5f5f0" text-decoration="underline" text-decoration-color="#3d5afe">receipts.</tspan></text>
  </g>

  <!-- Subheadline -->
  <text x="60" y="295" fill="#8c8ca0" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">
    Fine-tuned Qwen 1.5B (QLoRA) paired with hybrid Reciprocal Rank Fusion, Knowledge Graph reasoning,
  </text>
  <text x="60" y="318" fill="#8c8ca0" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">
    AST-secured Python sandbox, Neural Human Voice Tutor, and Vision-RAG for zero-hallucination exam prep.
  </text>

  <!-- Search Input Container with Voice & Vision Attached Preview -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="1080" height="110" rx="16" fill="#0d0d14" stroke="#2a2a38" stroke-width="1.5"/>

    <!-- Attached Image Preview Pill -->
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="280" height="34" rx="8" fill="#181828" stroke="#3d5afe" stroke-opacity="0.5" stroke-width="1"/>
      <rect x="6" y="5" width="24" height="24" rx="4" fill="#242436"/>
      <text x="18" y="21" fill="#3d5afe" font-size="12" text-anchor="middle">👁️</text>
      <text x="38" y="16" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="700">DFA_State_Diagram.png</text>
      <text x="38" y="27" fill="#888899" font-family="monospace" font-size="8">Multimodal Vision-RAG Active</text>
      <text x="265" y="21" fill="#888899" font-size="11">✕</text>
    </g>

    <!-- Text Input -->
    <text x="22" y="80" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="20" font-weight="300">
      How is Effective Memory Access Time calculated in 2-level paging with TLB hit ratio 90%?
    </text>
    <line x1="840" y1="62" x2="840" y2="88" stroke="#3d5afe" stroke-width="2.5"/>

    <!-- Interactive Input Buttons (Voice Mic + Image + Submit) -->
    <g transform="translate(930, 60)">
      <!-- Mic Voice Button -->
      <circle cx="20" cy="15" r="18" fill="#1c1c28" stroke="#333344" stroke-width="1"/>
      <text x="20" y="20" fill="#3d5afe" font-size="14" text-anchor="middle">🎙️</text>

      <!-- Image Button -->
      <circle cx="62" cy="15" r="18" fill="#1c1c28" stroke="#333344" stroke-width="1"/>
      <text x="62" y="20" fill="#3d5afe" font-size="14" text-anchor="middle">📷</text>

      <!-- Submit Arrow -->
      <circle cx="108" cy="15" r="22" fill="#3d5afe"/>
      <text x="108" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">→</text>
    </g>
  </g>

  <!-- Benchmark Preset Chips -->
  <g transform="translate(60, 505)">
    <text x="0" y="18" fill="#75758a" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.1em">⚡ PRESETS:</text>

    <!-- Preset 1 -->
    <rect x="90" y="0" width="180" height="28" rx="6" fill="#11111a" stroke="#252535" stroke-width="1"/>
    <text x="180" y="18" fill="#c0c0d5" font-family="monospace" font-size="10" text-anchor="middle">OS: 2-Level Paging EMAT →</text>

    <!-- Preset 2 -->
    <rect x="280" y="0" width="190" height="28" rx="6" fill="#11111a" stroke="#252535" stroke-width="1"/>
    <text x="375" y="18" fill="#c0c0d5" font-family="monospace" font-size="10" text-anchor="middle">DBMS: Strict 2PL Serial →</text>

    <!-- Preset 3 -->
    <rect x="480" y="0" width="170" height="28" rx="6" fill="#11111a" stroke="#252535" stroke-width="1"/>
    <text x="565" y="18" fill="#c0c0d5" font-family="monospace" font-size="10" text-anchor="middle">ALGO: Floyd's Heap O(n) →</text>

    <!-- Preset 4 -->
    <rect x="660" y="0" width="180" height="28" rx="6" fill="#11111a" stroke="#252535" stroke-width="1"/>
    <text x="750" y="18" fill="#c0c0d5" font-family="monospace" font-size="10" text-anchor="middle">CRAG: Colloquial Packet →</text>

    <!-- Preset 5 -->
    <rect x="850" y="0" width="160" height="28" rx="6" fill="#11111a" stroke="#252535" stroke-width="1"/>
    <text x="930" y="18" fill="#c0c0d5" font-family="monospace" font-size="10" text-anchor="middle">Vision: DFA Automata →</text>
  </g>

  <!-- 10 Subject Taxonomy Marquee -->
  <g transform="translate(60, 570)">
    <rect x="0" y="0" width="1080" height="130" rx="14" fill="#0b0b12" stroke="#1c1c28" stroke-width="1"/>
    
    <text x="25" y="32" fill="#8888a0" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.14em">10-SUBJECT GATE CS ONTOLOGY BROWSER</text>
    
    <g transform="translate(25, 55)">
      <!-- Subject 1 -->
      <rect x="0" y="0" width="120" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="60" y="17" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Operating Systems</text>

      <!-- Subject 2 -->
      <rect x="130" y="0" width="90" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="175" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">DBMS</text>

      <!-- Subject 3 -->
      <rect x="230" y="0" width="100" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="280" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">Algorithms</text>

      <!-- Subject 4 -->
      <rect x="340" y="0" width="90" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="385" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">TOC</text>

      <!-- Subject 5 -->
      <rect x="440" y="0" width="130" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="505" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">Computer Networks</text>

      <!-- Subject 6 -->
      <rect x="580" y="0" width="110" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="635" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">Compiler Design</text>

      <!-- Subject 7 -->
      <rect x="700" y="0" width="80" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="740" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">COA</text>

      <!-- Subject 8 -->
      <rect x="790" y="0" width="100" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="840" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">Digital Logic</text>

      <!-- Subject 9 -->
      <rect x="900" y="0" width="130" height="26" rx="5" fill="#151522" stroke="#252538" stroke-width="1"/>
      <text x="965" y="17" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">Discrete Math</text>
    </g>

    <text x="25" y="112" fill="#555566" font-family="monospace" font-size="9">
      Indexed Corpus: 77 Official GATE Papers (1991–2025) · 1,653 Semantic Chunks · In-Memory AST Sandbox Active
    </text>
  </g>
</svg>
