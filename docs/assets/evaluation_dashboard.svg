    <text x="25" y="168" fill="#ccc" font-family="monospace" font-size="12">Q03</text>
    <text x="100" y="168" fill="#3d5afe" font-family="monospace" font-size="12">DBMS</text>
    <text x="420" y="168" fill="#eee" font-family="-apple-system, sans-serif" font-size="12">Strict 2PL cascadeless abort elimination</text>
    <text x="790" y="168" fill="#00e676" font-family="monospace" font-size="12">0.9989</text>
    <text x="890" y="168" fill="#ccc" font-family="monospace" font-size="12">2 Verified</text>
    <text x="1010" y="168" fill="#00e676" font-family="monospace" font-size="12" font-weight="bold">PASS ✓</text>

    <!-- Row 4 -->
    <line x1="0" y1="190" x2="1080" y2="190" stroke="#222" stroke-width="1"/>
    <text x="25" y="218" fill="#ccc" font-family="monospace" font-size="12">Q04</text>
    <text x="100" y="218" fill="#3d5afe" font-family="monospace" font-size="12">Algorithms</text>
    <text x="420" y="218" fill="#eee" font-family="-apple-system, sans-serif" font-size="12">Floyd's bottom-up linear time max-heap build</text>
    <text x="790" y="218" fill="#00e676" font-family="monospace" font-size="12">0.9991</text>
    <text x="890" y="218" fill="#ccc" font-family="monospace" font-size="12">2 Verified</text>
    <text x="1010" y="218" fill="#00e676" font-family="monospace" font-size="12" font-weight="bold">PASS ✓</text>
