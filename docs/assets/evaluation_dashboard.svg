  <text x="60" y="105" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.03em">The Numbers.</text>

  <!-- 3 Model Comparison Cards -->
  <g transform="translate(60, 135)">
    <!-- Config 1: Base Qwen -->
    <rect x="0" y="0" width="340" height="170" rx="8" fill="#141416" stroke="#222" stroke-width="1"/>
    <text x="24" y="32" fill="#777" font-family="monospace" font-size="11" font-weight="bold">CONFIG 01</text>
    <text x="24" y="55" fill="#aaa" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Base Qwen 1.5B</text>
    <text x="24" y="115" fill="#666" font-family="-apple-system, sans-serif" font-size="48" font-weight="900">47.3%</text>
    <text x="24" y="145" fill="#555" font-family="monospace" font-size="12">Hallucinates ungrounded formulas</text>

    <!-- Config 2: Fine-Tuned Only -->
    <rect x="365" y="0" width="340" height="170" rx="8" fill="#141416" stroke="#222" stroke-width="1"/>
    <text x="389" y="32" fill="#777" font-family="monospace" font-size="11" font-weight="bold">CONFIG 02</text>
    <text x="389" y="55" fill="#aaa" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Fine-Tuned QLoRA</text>
    <text x="389" y="115" fill="#bbb" font-family="-apple-system, sans-serif" font-size="48" font-weight="900">63.0%</text>
    <text x="389" y="145" fill="#777" font-family="monospace" font-size="12">Strong reasoning, parametric drift</text>

    <!-- Config 3: CALYPSO-RAG -->
    <rect x="730" y="0" width="350" height="170" rx="8" fill="#141418" stroke="#3d5afe" stroke-width="2"/>
    <text x="754" y="32" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="bold">CONFIG 03 · CALYPSO-RAG</text>
    <text x="754" y="55" fill="#fff" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Fine-Tuned + Agentic RAG</text>
    <text x="754" y="115" fill="#3d5afe" font-family="-apple-system, sans-serif" font-size="48" font-weight="900">79.9%</text>
    <text x="754" y="145" fill="#00e676" font-family="monospace" font-size="12">Zero hallucination · 100% Provenance</text>
