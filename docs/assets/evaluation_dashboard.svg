<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <linearGradient id="evalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="740" fill="url(#evalBg)"/>
