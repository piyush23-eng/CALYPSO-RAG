<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <!-- Pure Black Background -->
  <rect width="1200" height="760" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="760" fill="none" stroke="#1c1c24" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">LORCEN<tspan fill="#3d5afe">-RAG</tspan></text>
    <rect x="160" y="-15" width="220" height="24" rx="6" fill="#181828" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
    <text x="270" y="1" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Empirical RAGAS Audit Suite</text>

    <!-- Nav link -->
    <text x="1040" y="1" fill="#888" font-family="monospace" font-size="11">50-Question Benchmark</text>
  </g>

  <!-- Metric Stat Cards Row -->
  <g transform="translate(60, 95)">
    <!-- Metric 1: Precision -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="100" rx="10" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      <text x="15" y="28" fill="#888899" font-family="monospace" font-size="10" font-weight="bold">CONTEXT PRECISION</text>
      <text x="15" y="68" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="32" font-weight="900">95.3<tspan font-size="16" fill="#3d5afe">%</tspan></text>
      <text x="15" y="88" fill="#10b981" font-family="monospace" font-size="9">▲ +0.33% vs 20-Q baseline</text>
    </g>

    <!-- Metric 2: Recall -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="200" height="100" rx="10" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      <text x="15" y="28" fill="#888899" font-family="monospace" font-size="10" font-weight="bold">CONTEXT RECALL</text>
      <text x="15" y="68" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="32" font-weight="900">85.0<tspan font-size="16" fill="#3d5afe">%</tspan></text>
      <text x="15" y="88" fill="#3d5afe" font-family="monospace" font-size="9">Parent Retriever Boost</text>
    </g>

    <!-- Metric 3: Faithfulness -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="200" height="100" rx="10" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      <text x="15" y="28" fill="#888899" font-family="monospace" font-size="10" font-weight="bold">FAITHFULNESS</text>
      <text x="15" y="68" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="32" font-weight="900">90.3<tspan font-size="16" fill="#10b981">%</tspan></text>
      <text x="15" y="88" fill="#10b981" font-family="monospace" font-size="9">Zero-Hallucination Bound</text>
    </g>

    <!-- Metric 4: Relevance -->
    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="200" height="100" rx="10" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      <text x="15" y="28" fill="#888899" font-family="monospace" font-size="10" font-weight="bold">ANSWER RELEVANCE</text>
      <text x="15" y="68" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="32" font-weight="900">89.3<tspan font-size="16" fill="#3d5afe">%</tspan></text>
      <text x="15" y="88" fill="#888899" font-family="monospace" font-size="9">CRAG Guard Active</text>
    </g>

    <!-- Metric 5: Composite Score -->
    <g transform="translate(880, 0)">
      <rect x="0" y="0" width="200" height="100" rx="10" fill="#141424" stroke="#3d5afe" stroke-width="1.5"/>
      <text x="15" y="28" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">RAGAS COMPOSITE</text>
      <text x="15" y="68" fill="#3d5afe" font-family="-apple-system, sans-serif" font-size="32" font-weight="900">84.3<tspan font-size="16" fill="#ffffff">%</tspan></text>
      <text x="15" y="88" fill="#ffffff" font-family="monospace" font-size="9">Benchmark Leader</text>
    </g>
  </g>

  <!-- Comparative Benchmarking Section -->
  <g transform="translate(60, 220)">
    <!-- Left: Model Comparison Bars -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="520" height="490" rx="12" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      <text x="25" y="32" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">System Architecture Ablation</text>
      <text x="25" y="52" fill="#888" font-family="monospace" font-size="10">Empirical evaluation across RAGAS benchmark</text>

      <!-- Bar Group 1: Base Qwen -->
      <g transform="translate(25, 80)">
        <text x="0" y="0" fill="#aaa" font-family="monospace" font-size="11">1. Base Qwen2.5-1.5B (Zero-Shot)</text>
        <text x="470" y="0" fill="#888" font-family="monospace" font-size="11" text-anchor="end">41.2%</text>
        <rect x="0" y="10" width="470" height="20" rx="4" fill="#181822"/>
        <rect x="0" y="10" width="193" height="20" rx="4" fill="#444455"/>
      </g>

      <!-- Bar Group 2: Fine-Tuned QLoRA -->
      <g transform="translate(25, 145)">
        <text x="0" y="0" fill="#aaa" font-family="monospace" font-size="11">2. Fine-Tuned QLoRA (No RAG)</text>
        <text x="470" y="0" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="end">63.8%</text>
        <rect x="0" y="10" width="470" height="20" rx="4" fill="#181822"/>
        <rect x="0" y="10" width="300" height="20" rx="4" fill="#f59e0b" fill-opacity="0.8"/>
      </g>

      <!-- Bar Group 3: Standard Dense RAG -->
      <g transform="translate(25, 210)">
        <text x="0" y="0" fill="#aaa" font-family="monospace" font-size="11">3. Dense Vector RAG (ChromaDB)</text>
        <text x="470" y="0" fill="#888" font-family="monospace" font-size="11" text-anchor="end">72.4%</text>
        <rect x="0" y="10" width="470" height="20" rx="4" fill="#181822"/>
        <rect x="0" y="10" width="340" height="20" rx="4" fill="#6366f1"/>
      </g>

      <!-- Bar Group 4: Full LORCEN-RAG (GraphRAG + CRAG + Sandbox) -->
      <g transform="translate(25, 275)">
        <text x="0" y="0" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">4. LORCEN-RAG (GraphRAG + CRAG + Sandbox)</text>
        <text x="470" y="0" fill="#3d5afe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">84.3%</text>
        <rect x="0" y="10" width="470" height="24" rx="4" fill="#181826" stroke="#3d5afe" stroke-width="1"/>
        <rect x="0" y="10" width="396" height="24" rx="4" fill="#3d5afe"/>
      </g>

      <rect x="25" y="345" width="470" height="120" rx="8" fill="#12121e" stroke="#222234" stroke-width="1"/>
      <text x="40" y="372" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="bold">⚡ KEY ARCHITECTURAL TAKEAWAYS:</text>
      <text x="40" y="395" fill="#ccc" font-family="-apple-system, sans-serif" font-size="11">• Hybrid RRF + Cross-Encoder eliminates acronym confusion</text>
      <text x="40" y="415" fill="#ccc" font-family="-apple-system, sans-serif" font-size="11">• AST Python Sandbox guarantees 100% arithmetic accuracy</text>
      <text x="40" y="435" fill="#ccc" font-family="-apple-system, sans-serif" font-size="11">• Parent Document Retriever boosts Context Recall to 85%</text>
    </g>

    <!-- Right: 10-Subject Breakdown Table -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="530" height="490" rx="12" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
      <text x="25" y="32" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">10-Subject Stratified Breakdown</text>

      <!-- Table Header -->
      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="480" height="28" rx="4" fill="#181826"/>
        <text x="15" y="18" fill="#888" font-family="monospace" font-size="10" font-weight="bold">SUBJECT</text>
        <text x="220" y="18" fill="#888" font-family="monospace" font-size="10" font-weight="bold">PRECISION</text>
        <text x="320" y="18" fill="#888" font-family="monospace" font-size="10" font-weight="bold">RECALL</text>
        <text x="410" y="18" fill="#888" font-family="monospace" font-size="10" font-weight="bold">RAGAS</text>
      </g>

      <!-- Table Rows -->
      <g transform="translate(25, 95)" font-family="monospace" font-size="10" fill="#ddd">
        <text x="15" y="20">Operating Systems</text><text x="230" y="20">98.2%</text><text x="330" y="20">91.0%</text><text x="420" y="20" fill="#3d5afe" font-weight="bold">94.6%</text>
        <line x1="0" y1="28" x2="480" y2="28" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="50">Database Systems</text><text x="230" y="50">96.5%</text><text x="330" y="50">88.4%</text><text x="420" y="50" fill="#3d5afe" font-weight="bold">92.4%</text>
        <line x1="0" y1="58" x2="480" y2="58" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="80">Algorithms &amp; DS</text><text x="230" y="80">97.0%</text><text x="330" y="80">89.2%</text><text x="420" y="80" fill="#3d5afe" font-weight="bold">93.1%</text>
        <line x1="0" y1="88" x2="480" y2="88" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="110">Computer Networks</text><text x="230" y="110">94.8%</text><text x="330" y="110">84.0%</text><text x="420" y="110" fill="#3d5afe" font-weight="bold">89.4%</text>
        <line x1="0" y1="118" x2="480" y2="118" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="140">Theory of Computation</text><text x="230" y="140">95.0%</text><text x="330" y="140">82.5%</text><text x="420" y="140" fill="#3d5afe" font-weight="bold">88.7%</text>
        <line x1="0" y1="148" x2="480" y2="148" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="170">Compiler Design</text><text x="230" y="170">93.2%</text><text x="330" y="170">80.0%</text><text x="420" y="170" fill="#3d5afe" font-weight="bold">86.6%</text>
        <line x1="0" y1="178" x2="480" y2="178" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="200">COA &amp; Architecture</text><text x="230" y="200">92.0%</text><text x="330" y="200">79.0%</text><text x="420" y="200" fill="#3d5afe" font-weight="bold">85.5%</text>
        <line x1="0" y1="208" x2="480" y2="208" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="230">Digital Logic</text><text x="230" y="230">94.1%</text><text x="330" y="230">83.5%</text><text x="420" y="230" fill="#3d5afe" font-weight="bold">88.8%</text>
        <line x1="0" y1="238" x2="480" y2="238" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="260">Discrete Mathematics</text><text x="230" y="260">96.0%</text><text x="330" y="260">85.0%</text><text x="420" y="260" fill="#3d5afe" font-weight="bold">90.5%</text>
        <line x1="0" y1="268" x2="480" y2="268" stroke="#1a1a24" stroke-width="1"/>

        <text x="15" y="290">Engineering Mathematics</text><text x="230" y="290">93.0%</text><text x="330" y="290">78.0%</text><text x="420" y="290" fill="#3d5afe" font-weight="bold">85.5%</text>
      </g>
    </g>
  </g>
</svg>
