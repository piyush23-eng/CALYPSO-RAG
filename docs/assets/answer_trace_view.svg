<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <!-- Pure Black Background -->
  <rect width="1200" height="860" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="860" fill="none" stroke="#1c1c24" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(60, 45)">
    <!-- Subject Badge -->
    <rect x="0" y="0" width="145" height="28" rx="14" fill="#181828" stroke="#3d5afe" stroke-opacity="0.5" stroke-width="1"/>
    <text x="72" y="18" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">OPERATING SYSTEMS</text>

    <!-- Relevance Score -->
    <rect x="160" y="0" width="155" height="28" rx="14" fill="#12121a" stroke="#252535" stroke-width="1"/>
    <text x="175" y="18" fill="#888899" font-family="monospace" font-size="11">Relevance:</text>
    <text x="250" y="18" fill="#f5f5f0" font-family="monospace" font-size="11" font-weight="bold">0.9963</text>

    <!-- Confidence Indicator -->
    <rect x="330" y="0" width="170" height="28" rx="14" fill="#14192e" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="345" cy="14" r="3" fill="#3d5afe"/>
    <text x="355" y="18" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="600">High System Confidence</text>

    <!-- Gate Passed -->
    <text x="520" y="18" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="600">✓ Gate Passed</text>

    <!-- Bookmark Button -->
    <rect x="940" y="0" width="140" height="28" rx="6" fill="#141420" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
    <text x="1010" y="18" fill="#3d5afe" font-family="monospace" font-size="11" text-anchor="middle">★ Bookmarked</text>
  </g>

  <!-- Editorial Answer Card -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="1080" height="490" rx="16" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#3d5afe" stroke-opacity="0.6" stroke-width="2"/>

    <!-- Answer Card Header with Voice Tutor Player -->
    <g transform="translate(25, 25)">
      <text x="0" y="18" fill="#888899" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.12em">VERIFIED MATHEMATICAL DERIVATION &amp; PROOF</text>
      
      <!-- IIT Professor Voice Player Toolbar -->
      <g transform="translate(560, 0)">
        <!-- Voice Persona Select -->
        <rect x="0" y="0" width="180" height="30" rx="6" fill="#161624" stroke="#2c2c3e" stroke-width="1"/>
        <text x="10" y="19" fill="#f5f5f0" font-family="monospace" font-size="10">Prof. Prabhat (IIT Faculty)</text>
        <text x="165" y="19" fill="#888" font-size="9">▾</text>

        <!-- Audio Play Button -->
        <rect x="190" y="0" width="170" height="30" rx="6" fill="#1c1d32" stroke="#3d5afe" stroke-width="1"/>
        <text x="205" y="19" fill="#3d5afe" font-size="12">🎙️</text>
        <text x="225" y="19" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">Listen to Walkthrough</text>

        <!-- Speed -->
        <rect x="370" y="0" width="45" height="30" rx="6" fill="#161624" stroke="#2c2c3e" stroke-width="1"/>
        <text x="392" y="19" fill="#ccc" font-family="monospace" font-size="10" text-anchor="middle">1.0x</text>
      </g>
    </g>

    <line x1="25" y1="70" x2="1055" y2="70" stroke="#1c1c28" stroke-width="1"/>

    <!-- Mathematical Derivation Body -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#1e1e30" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
      <text x="30" y="14" fill="#3d5afe" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">STAGE 1</text>
      <text x="75" y="16" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">Effective Memory Access Time (EMAT) Formulation</text>

      <text x="0" y="48" fill="#d0d0dc" font-family="-apple-system, sans-serif" font-size="14">
        In a 2-level paging architecture, let <tspan font-family="monospace" fill="#3d5afe">h = 0.90</tspan> be the TLB hit ratio, <tspan font-family="monospace" fill="#3d5afe">t_TLB = 20 ns</tspan>, and <tspan font-family="monospace" fill="#3d5afe">t_m = 100 ns</tspan>.
      </text>

      <rect x="0" y="65" width="1020" height="42" rx="6" fill="#14141e" stroke="#222232" stroke-width="1"/>
      <text x="20" y="91" fill="#f5f5f0" font-family="monospace" font-size="13">
        EMAT = h × (t_TLB + t_m) + (1 - h) × [ t_TLB + (k + 1) × t_m ]
      </text>

      <text x="0" y="132" fill="#d0d0dc" font-family="-apple-system, sans-serif" font-size="14">
        1. When TLB Hits (90% probability): Access = 20 ns (TLB) + 100 ns (Physical Frame) = <tspan font-weight="bold" fill="#10b981">120 ns</tspan>.
      </text>
      <text x="0" y="156" fill="#d0d0dc" font-family="-apple-system, sans-serif" font-size="14">
        2. When TLB Misses (10% probability): Access = 20 ns (TLB) + 2 × 100 ns (2-level Page Tables) + 100 ns = <tspan font-weight="bold" fill="#f59e0b">320 ns</tspan>.
      </text>

      <rect x="0" y="175" width="1020" height="38" rx="6" fill="#14141e" stroke="#222232" stroke-width="1"/>
      <text x="20" y="199" fill="#3d5afe" font-family="monospace" font-size="13" font-weight="bold">
        EMAT = 0.90 × (120 ns) + 0.10 × (320 ns) = 108 ns + 32 ns = 140.00 ns
      </text>
    </g>

    <!-- Embedded Targeted Simulation Lab Bar -->
    <g transform="translate(25, 340)">
      <line x1="0" y1="0" x2="1030" y2="0" stroke="#222232" stroke-width="1"/>

      <rect x="0" y="15" width="340" height="34" rx="8" fill="#18182c" stroke="#3d5afe" stroke-width="1"/>
      <text x="15" y="36" fill="#3d5afe" font-size="13">⚡</text>
      <text x="35" y="36" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="bold">2-Level Paging &amp; EMAT Simulator</text>
      <circle cx="320" cy="32" r="3" fill="#10b981"/>

      <!-- Live Slider Controls Preview -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="1030" height="70" rx="8" fill="#12121c" stroke="#1f1f2e" stroke-width="1"/>
        
        <!-- Slider 1 -->
        <text x="20" y="25" fill="#888" font-family="monospace" font-size="10">TLB Hit Rate (h): <tspan fill="#3d5afe" font-weight="bold">90%</tspan></text>
        <line x1="20" y1="42" x2="220" y2="42" stroke="#333" stroke-width="4"/>
        <line x1="20" y1="42" x2="200" y2="42" stroke="#3d5afe" stroke-width="4"/>
        <circle cx="200" cy="42" r="6" fill="#3d5afe"/>

        <!-- Slider 2 -->
        <text x="270" y="25" fill="#888" font-family="monospace" font-size="10">TLB Latency: <tspan fill="#3d5afe" font-weight="bold">20 ns</tspan></text>
        <line x1="270" y1="42" x2="470" y2="42" stroke="#333" stroke-width="4"/>
        <line x1="270" y1="42" x2="350" y2="42" stroke="#3d5afe" stroke-width="4"/>
        <circle cx="350" cy="42" r="6" fill="#3d5afe"/>

        <!-- Slider 3 -->
        <text x="520" y="25" fill="#888" font-family="monospace" font-size="10">Memory Latency: <tspan fill="#3d5afe" font-weight="bold">100 ns</tspan></text>
        <line x1="520" y1="42" x2="720" y2="42" stroke="#333" stroke-width="4"/>
        <line x1="520" y1="42" x2="620" y2="42" stroke="#3d5afe" stroke-width="4"/>
        <circle cx="620" cy="42" r="6" fill="#3d5afe"/>

        <!-- Output Display -->
        <rect x="760" y="10" width="250" height="50" rx="6" fill="#1a1a2a" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
        <text x="780" y="32" fill="#888" font-family="monospace" font-size="9">CALCULATED EMAT:</text>
        <text x="780" y="50" fill="#3d5afe" font-family="-apple-system, sans-serif" font-size="20" font-weight="900">140.00 <tspan font-size="12" fill="#888">ns</tspan></text>
      </g>
    </g>
  </g>

  <!-- Evidence Attribution Receipts -->
  <g transform="translate(60, 610)">
    <text x="0" y="15" fill="#8888a0" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.14em">EVIDENCE SOURCES (3 VERIFIED RECEIPTS · ATTRIBUTION COSINE SIM ≥ 0.60)</text>

    <!-- Receipt 1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="345" height="170" rx="10" fill="#0e0e16" stroke="#252535" stroke-width="1"/>
      <text x="15" y="25" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">[1] RECEIPT</text>
      <text x="315" y="25" fill="#888" font-size="12">↗</text>
      <text x="15" y="50" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Operating Systems / Paging</text>
      <text x="15" y="70" fill="#888899" font-family="monospace" font-size="9">2025_cs_set1_paper_pyqs.md</text>
      
      <rect x="15" y="85" width="315" height="45" rx="4" fill="#141420"/>
      <text x="25" y="105" fill="#aaaab8" font-family="monospace" font-size="9">"EMAT = h*(t_tlb + t_m) +</text>
      <text x="25" y="120" fill="#aaaab8" font-family="monospace" font-size="9">(1-h)*(t_tlb + (k+1)*t_m)"</text>

      <text x="15" y="155" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">Sim: 0.9963</text>
    </g>

    <!-- Receipt 2 -->
    <g transform="translate(365, 30)">
      <rect x="0" y="0" width="345" height="170" rx="10" fill="#0e0e16" stroke="#252535" stroke-width="1"/>
      <text x="15" y="25" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">[2] RECEIPT</text>
      <text x="315" y="25" fill="#888" font-size="12">↗</text>
      <text x="15" y="50" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Virtual Memory &amp; TLB Invariants</text>
      <text x="15" y="70" fill="#888899" font-family="monospace" font-size="9">os_virtual_memory_theory.md</text>
      
      <rect x="15" y="85" width="315" height="45" rx="4" fill="#141420"/>
      <text x="25" y="105" fill="#aaaab8" font-family="monospace" font-size="9">"Multi-level page table walk</text>
      <text x="25" y="120" fill="#aaaab8" font-family="monospace" font-size="9">requires k memory accesses"</text>

      <text x="15" y="155" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">Sim: 0.9412</text>
    </g>

    <!-- Receipt 3 -->
    <g transform="translate(730, 30)">
      <rect x="0" y="0" width="350" height="170" rx="10" fill="#0e0e16" stroke="#252535" stroke-width="1"/>
      <text x="15" y="25" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">[3] RECEIPT</text>
      <text x="320" y="25" fill="#888" font-size="12">↗</text>
      <text x="15" y="50" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Knowledge Graph Relational Triplet</text>
      <text x="15" y="70" fill="#888899" font-family="monospace" font-size="9">graphrag_ontology_invariants.json</text>
      
      <rect x="15" y="85" width="320" height="45" rx="4" fill="#141420"/>
      <text x="25" y="105" fill="#aaaab8" font-family="monospace" font-size="9">[Two-Level Paging] --[requires]--> </text>
      <text x="25" y="120" fill="#aaaab8" font-family="monospace" font-size="9">[2 Memory Accesses per TLB Miss]</text>

      <text x="15" y="155" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold">Sim: 0.8920</text>
    </g>
  </g>
</svg>
