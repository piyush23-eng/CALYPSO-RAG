    <text x="25" y="35" fill="#3d5afe" font-family="monospace" font-size="13" font-weight="bold">1. ROTATIONAL &amp; SECTOR TRANSFER CALCULATIONS</text>
    <text x="25" y="65" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Rotational Speed N = 15000 rpm = 250 rev/sec</text>
    <text x="25" y="90" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• One Full Revolution Time: T_rev = 1000 / 250 = 4.0 ms</text>
    <text x="25" y="115" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Average Rotational Latency: T_rot = 4.0 / 2 = 2.0 ms</text>
    <text x="25" y="140" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Sector Transfer Time: T_transfer = 4.0 ms / 400 sectors = 0.01 ms</text>
    <text x="25" y="165" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Time to read 10 random sectors on 1 track = 10 × (2.0 + 0.01) = 20.1 ms</text>

    <line x1="25" y1="190" x2="655" y2="190" stroke="#222" stroke-width="1"/>

    <text x="25" y="220" fill="#3d5afe" font-family="monospace" font-size="13" font-weight="bold">2. SEEK TIME TRAJECTORY (Track 0 → 5 → 12 → 7)</text>
    <text x="25" y="245" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Track 0 → 5: |5 - 0| × 1 ms = 5 ms</text>
    <text x="25" y="270" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Track 5 → 12: |12 - 5| × 1 ms = 7 ms</text>
    <text x="25" y="295" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Track 12 → 7: |7 - 12| × 1 ms = 5 ms</text>
    <text x="25" y="320" fill="#ccc" font-family="-apple-system, sans-serif" font-size="13">• Total Seek Time = 5 + 7 + 5 = 17.0 ms</text>

    <line x1="25" y1="345" x2="655" y2="345" stroke="#222" stroke-width="1"/>

    <text x="25" y="375" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">TOTAL TRANSFER TIME: 17.0 ms + (3 × 20.1 ms) = </text>
    <rect x="420" y="355" width="110" height="32" rx="4" fill="#3d5afe"/>
    <text x="475" y="376" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">77.3 ms</text>
