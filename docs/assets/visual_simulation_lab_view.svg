<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <!-- Pure Black Background -->
  <rect width="1200" height="760" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="760" fill="none" stroke="#1c1c24" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f5f5f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">CALYPSO<tspan fill="#3d5afe">-RAG</tspan></text>
    <rect x="160" y="-15" width="220" height="24" rx="6" fill="#181828" stroke="#3d5afe" stroke-opacity="0.4" stroke-width="1"/>
    <text x="270" y="1" fill="#3d5afe" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Universal Simulation Suite</text>
  </g>

  <!-- Lab Container Card -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="1080" height="600" rx="16" fill="#0c0d16" stroke="#252538" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#3d5afe" stroke-width="2"/>

    <!-- Lab Top Bar -->
    <g transform="translate(30, 30)">
      <circle cx="12" cy="12" r="10" fill="#1e1e32"/>
      <text x="12" y="16" fill="#3d5afe" font-size="12" text-anchor="middle">🎛️</text>
      <text x="32" y="10" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="0.12em">UNIVERSAL GATE CS SIMULATION LABS</text>
      <text x="32" y="28" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">Multi-Subject Mathematical Parameter Playground</text>

      <!-- 8-Tab Switcher -->
      <g transform="translate(0, 45)">
        <rect x="0" y="0" width="1020" height="42" rx="8" fill="#141420" stroke="#252535" stroke-width="1"/>
        
        <!-- Tab 1 (Active) -->
        <rect x="5" y="4" width="120" height="34" rx="6" fill="#3d5afe"/>
        <text x="65" y="25" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Paging/EMAT</text>

        <!-- Tab 2 -->
        <text x="195" y="25" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">Sliding Window</text>

        <!-- Tab 3 -->
        <text x="325" y="25" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">Cache AMAT</text>

        <!-- Tab 4 -->
        <text x="445" y="25" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">Pipelining</text>

        <!-- Tab 5 -->
        <text x="560" y="25" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">Disk Arm</text>

        <!-- Tab 6 -->
        <text x="685" y="25" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">Master Theorem</text>

        <!-- Tab 7 -->
        <text x="815" y="25" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">CIDR Subnet</text>

        <!-- Tab 8 -->
        <text x="945" y="25" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">B+ Tree Fanout</text>
      </g>
    </g>

    <!-- Lab Content Split Grid -->
    <g transform="translate(30, 150)">
      <!-- Left Column: Interactive Sliders -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="580" height="400" rx="10" fill="#11111c" stroke="#1f1f2e" stroke-width="1"/>
        
        <text x="25" y="32" fill="#f5f5f0" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Parameter Controls (Operating Systems)</text>

        <!-- Slider 1: Hit Ratio -->
        <g transform="translate(25, 60)">
          <text x="0" y="0" fill="#888" font-family="monospace" font-size="11">TLB Hit Ratio (h):</text>
          <text x="520" y="0" fill="#3d5afe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">90%</text>
          <line x1="0" y1="18" x2="520" y2="18" stroke="#252535" stroke-width="6" stroke-linecap="round"/>
          <line x1="0" y1="18" x2="440" y2="18" stroke="#3d5afe" stroke-width="6" stroke-linecap="round"/>
          <circle cx="440" cy="18" r="9" fill="#3d5afe"/>
        </g>

        <!-- Slider 2: TLB Access Time -->
        <g transform="translate(25, 130)">
          <text x="0" y="0" fill="#888" font-family="monospace" font-size="11">TLB Access Latency (t_TLB):</text>
          <text x="520" y="0" fill="#3d5afe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">20 ns</text>
          <line x1="0" y1="18" x2="520" y2="18" stroke="#252535" stroke-width="6" stroke-linecap="round"/>
          <line x1="0" y1="18" x2="220" y2="18" stroke="#3d5afe" stroke-width="6" stroke-linecap="round"/>
          <circle cx="220" cy="18" r="9" fill="#3d5afe"/>
        </g>

        <!-- Slider 3: Memory Access Time -->
        <g transform="translate(25, 200)">
          <text x="0" y="0" fill="#888" font-family="monospace" font-size="11">Main Memory Latency (t_m):</text>
          <text x="520" y="0" fill="#3d5afe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">100 ns</text>
          <line x1="0" y1="18" x2="520" y2="18" stroke="#252535" stroke-width="6" stroke-linecap="round"/>
          <line x1="0" y1="18" x2="300" y2="18" stroke="#3d5afe" stroke-width="6" stroke-linecap="round"/>
          <circle cx="300" cy="18" r="9" fill="#3d5afe"/>
        </g>

        <!-- Slider 4: Page Levels -->
        <g transform="translate(25, 270)">
          <text x="0" y="0" fill="#888" font-family="monospace" font-size="11">Page Table Levels (k):</text>
          <text x="520" y="0" fill="#3d5afe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">2-Level Paging</text>
          
          <g transform="translate(0, 18)">
            <rect x="0" y="0" width="120" height="32" rx="6" fill="#181826" stroke="#2c2c3e" stroke-width="1"/>
            <text x="60" y="20" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">1 Level</text>

            <rect x="130" y="0" width="120" height="32" rx="6" fill="#1e1e36" stroke="#3d5afe" stroke-width="1.5"/>
            <text x="190" y="20" fill="#3d5afe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2 Levels (Active)</text>

            <rect x="260" y="0" width="120" height="32" rx="6" fill="#181826" stroke="#2c2c3e" stroke-width="1"/>
            <text x="320" y="20" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">3 Levels</text>

            <rect x="390" y="0" width="120" height="32" rx="6" fill="#181826" stroke="#2c2c3e" stroke-width="1"/>
            <text x="450" y="20" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">4 Levels</text>
          </g>
        </g>
      </g>

      <!-- Right Column: Real-Time Calculated Math Output -->
      <g transform="translate(610, 0)">
        <rect x="0" y="0" width="410" height="400" rx="10" fill="#141420" stroke="#28283c" stroke-width="1"/>
        
        <text x="25" y="32" fill="#888899" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="0.12em">CALCULATED EMAT (LIVE)</text>
        
        <text x="25" y="85" fill="#3d5afe" font-family="-apple-system, sans-serif" font-size="46" font-weight="900">140.00 <tspan font-size="16" fill="#888">ns</tspan></text>

        <line x1="25" y1="115" x2="385" y2="115" stroke="#252535" stroke-width="1"/>

        <!-- Breakdown List -->
        <g transform="translate(25, 140)">
          <text x="0" y="0" fill="#aaa" font-family="monospace" font-size="11">TLB Hit Cost (t_tlb + t_m):</text>
          <text x="355" y="0" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">120 ns</text>

          <text x="0" y="30" fill="#aaa" font-family="monospace" font-size="11">TLB Miss Cost (t_tlb + 3·t_m):</text>
          <text x="355" y="30" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">320 ns</text>

          <text x="0" y="60" fill="#aaa" font-family="monospace" font-size="11">Page Walk Penalty (2·t_m):</text>
          <text x="355" y="60" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">200 ns</text>
        </g>

        <!-- Live Step Code Box -->
        <g transform="translate(25, 235)">
          <rect x="0" y="0" width="360" height="135" rx="6" fill="#0c0d14" stroke="#1f1f2e" stroke-width="1"/>
          <text x="15" y="25" fill="#888" font-family="monospace" font-size="10">Real-time Substitution Formula:</text>
          <text x="15" y="50" fill="#f5f5f0" font-family="monospace" font-size="11">EMAT = h·(HitCost) + (1-h)·(MissCost)</text>
          <text x="15" y="75" fill="#3d5afe" font-family="monospace" font-size="11">     = 0.90 × 120 + 0.10 × 320</text>
          <text x="15" y="100" fill="#3d5afe" font-family="monospace" font-size="11">     = 108.0 + 32.0</text>
          <text x="15" y="122" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">     = 140.00 nanoseconds</text>
        </g>
      </g>
    </g>
  </g>
</svg>
